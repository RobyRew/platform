# Included at server level AND inside every location that sets its own header.
#
# nginx's add_header does not merge: a block containing ANY add_header discards
# every header inherited from its parent. A location that only set Cache-Control
# therefore served the page with no CSP, no HSTS and no frame protection — and
# because `index index.html` re-matches locations, that applied to the HTML
# itself, the one response where the policy matters most.
add_header Content-Security-Policy $csp always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), midi=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
