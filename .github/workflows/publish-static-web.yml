# Publishes the shared nginx runtime used by the static sites.
# Versioned tags are what apps pin to; :1 moves with patch releases.
name: Publish static-web image

on:
  push:
    branches: [main]
    paths: ['images/static-web/**', '.github/workflows/publish-static-web.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/static-web
          push: true
          tags: |
            ghcr.io/robyrew/static-web:1
            ghcr.io/robyrew/static-web:1.0.0
            ghcr.io/robyrew/static-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
